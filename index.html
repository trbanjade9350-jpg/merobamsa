function commit(docs){
  docs.forEach(d=>{ if(d._del) local.docs[d.id]={id:d.id,_del:1}; else local.docs[d.id]=Object.assign({},d,{ts:Date.now()}); });
  pcache=null;gcache=null;

function fixSel(){
  const g=GR();
  if(state.sel&&!g.by.has(state.sel)) state.sel=null;
  if(state.me&&!g.by.has(state.me)) state.me=null;
  if(state.anchor&&!g.by.has(state.anchor)) state.anchor=null;
  if(!state.me){ const s=persons().find(p=>p.sample&&p.id==='s11'); if(s) state.me=s.id; }
}
function deleteMany(ids){
  const set=new Set(ids),out=[];
  persons().forEach(p=>{
    if(set.has(p.id)){ out.push({id:p.id,_del:1}); return; }
    const par=(p.parents||[]).filter(r=>!set.has(r.id)),sp=(p.spouses||[]).filter(s=>!set.has(s));
    if(par.length!==(p.parents||[]).length||sp.length!==(p.spouses||[]).length){ const c=JSON.parse(JSON.stringify(p)); c.parents=par; c.spouses=sp; out.push(c); }
  });
  if(state.sel&&set.has(state.sel)) state.sel=null;
  commit(out);
}

function drawStage(){
  const g=GR(),stage=$('#stage'); if(!stage) return;
  let ids=g.by.keys?[...g.by.keys()]:[];
  if(state.scope==='family'&&state.me&&g.by.has(state.me)) ids=component(g,state.me);
  const L=layout(g,ids,LO),idset=new Set(ids);
  const kinMap=(state.kin&&state.me&&g.by.has(state.me))?kinFrom(g,state.me):null;
  const mid=LO.h/2,hw=LO.w/2;
  const curve=(x1,y1,x2,y2)=>{const m=(y1+y2)/2;return `M${x1.toFixed(1)} ${y1.toFixed(1)}C${x1.toFixed(1)} ${m.toFixed(1)},${x2.toFixed(1)} ${m.toFixed(1)},${x2.toFixed(1)} ${y2.toFixed(1)}`;};
  let paths='';const lcMap=new Map();const lcOf=ps=>{const k=ps.map(r=>r.id).sort().join('|');if(!lcMap.has(k)) lcMap.set(k,lcMap.size%8);return lcMap.get(k);};
  L.units.forEach(u=>{
    for(let i=1;i<u.length;i++){
      const a=u[i-1],b=u[i],y=L.Y.get(a)+mid,x1=L.X.get(a)+hw,x2=L.X.get(b)-hw;
      paths+=`<path class="sp" d="M${x1} ${y-2.5}H${x2}"/><path class="sp" d="M${x1} ${y+2.5}H${x2}"/>`;
    }
  });
  ids.forEach(c=>{
    const ps=g.par.get(c).filter(r=>idset.has(r.id));
    const cx=L.X.get(c),cy=L.Y.get(c);
    if(ps.length===2){
      const a=L.ord.get(ps[0].id),b=L.ord.get(ps[1].id);
      if(a.u===b.u&&Math.abs(a.i-b.i)===1){
        const mx=(L.X.get(ps[0].id)+L.X.get(ps[1].id))/2,my=L.Y.get(ps[0].id)+mid,yb=L.Y.get(ps[0].id)+LO.h;
        const dash=ps.some(r=>r.k&&r.k!=='जन्म');
        paths+=`<path d="M${mx.toFixed(1)} ${my}V${yb}${curve(mx,yb,cx,cy).replace(/^M[^C]*/,'')}"${dash?' stroke-dasharray="5 4"':''} data-lc="${lcOf(ps)}" style="stroke:var(--lc${lcOf(ps)})"/>`;
        return;
      }
    }
    ps.forEach(r=>{ const dash=r.k&&r.k!=='जन्म'; paths+=`<path d="${curve(L.X.get(r.id),L.Y.get(r.id)+LO.h,cx,cy)}"${dash?' stroke-dasharray="5 4"':''} data-lc="${lcOf(ps)}" style="stroke:var(--lc${lcOf(ps)})"/>`; });
  });
  let nodes='';
  ids.forEach(id=>{
    const p=g.by.get(id),x=L.X.get(id)-hw,y=L.Y.get(id);
    let kin='';
    if(kinMap){
      if(id===state.me) kin='<span class="kin self">आफू</span>';
      else { const k=kinInfo(g,state.me,id,kinMap); if(k) kin=`<span class="kin${k.marriage?' mar':''}" title="${esc(k.desc)}">${esc(k.term)}</span>`; }
    }
    nodes+=`<button class="node g-${p.g}${p.dead?' dead':''}${p.ph?' ph':''}${id===state.sel?' sel':''}${id===state.me?' me':''}" data-act="pick" data-id="${esc(id)}" style="left:${x.toFixed(1)}px;top:${y}px" title="${esc(dn(p))}">${kin}<i class="sym"></i><span class="nm">${esc(dn(p))}</span><span class="mt">${esc(meta(p))}</span></button>`;
  });
  const z=state.zoom;
  stage.style.width=L.width+'px'; stage.style.height=L.height+'px'; stage.style.transform=`scale(${z})`;
  $('#zoomer').style.width=(L.width*z)+'px'; $('#zoomer').style.height=(L.height*z)+'px';
  stage.innerHTML=`<svg class="edges" width="${L.width}" height="${L.height}" aria-hidden="true">${paths}</svg>${nodes}`;
}

/* ---------- वंशावली चित्रका रूपमा डाउनलोड ---------- */
async function exportChartImage(btn,all){
  if(!$('#stage')) return;
  const prevScope=state.scope;
  if(all&&state.scope!=='all'){ state.scope='all'; drawStage(); }
  const stage=$('#stage');
  const restore=()=>{ if(state.scope!==prevScope){ state.scope=prevScope; drawStage(); } };
  const nodes=$$('.node',stage);
  const W=parseFloat(stage.style.width),H=parseFloat(stage.style.height);
  if(!nodes.length||!W||!H){ restore(); toast('चित्र बनाउन चार्टमा सदस्य छैनन्।'); return; }
  if(btn) btn.disabled=true;
  toast('चित्र बनाउँदै…');
  try{
    try{ if(document.fonts) await Promise.all([document.fonts.load('600 14px Mukta','अआक'),document.fonts.load('400 12px Mukta','अआक'),document.fonts.load('400 26px "Yatra One"','नाता')]); }catch(e){}
    const C={bg:'#ffffff',ink:'#15203a',muted:'#56627f',line:'#d2d8e6',edge:'#8792b0',accent:'#ab2438',indigo:'#2a4890',gold:'#946508',me:'#e9edf7'};
    const FB=', "Noto Sans Devanagari", system-ui, sans-serif';
    const LC=['#2563eb','#ea580c','#16a34a','#9333ea','#0891b2','#c026d3','#92400e','#334155'];
    const HEAD=76,FOOT=46;
    const cw=Math.max(W,780),ch=H+HEAD+FOOT,ox=(cw-W)/2;
    const s=Math.min(2,12000/cw,12000/ch,Math.sqrt(40e6/(cw*ch)));
    const canvas=document.createElement('canvas');
    canvas.width=Math.round(cw*s); canvas.height=Math.round(ch*s);
    const ctx=canvas.getContext('2d');
    ctx.scale(s,s);
    const seg=t=>(typeof Intl!=='undefined'&&Intl.Segmenter)?Array.from(new Intl.Segmenter('ne',{granularity:'grapheme'}).segment(t),x=>x.segment):Array.from(t);
    const rr=(x,y,w,h,r)=>{ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); };
    const fit=(t,maxW)=>{ if(ctx.measureText(t).width<=maxW) return t; const a=seg(t); while(a.length&&ctx.measureText(a.join('')+'…').width>maxW) a.pop(); return a.join('')+'…'; };
    const wrap=(t,maxW,maxL)=>{
      const words=t.split(/\s+/).filter(Boolean),lines=[]; let cur='';
      for(const w of words){
        const tr=cur?cur+' '+w:w;
        if(ctx.measureText(tr).width<=maxW){ cur=tr; continue; }
        if(cur){ lines.push(cur); cur=''; }
        if(ctx.measureText(w).width<=maxW){ cur=w; }
        else { let part=''; for(const g of seg(w)){ if(part&&ctx.measureText(part+g).width>maxW){ lines.push(part); part=''; } part+=g; } cur=part; }
      }
      if(cur) lines.push(cur);
      if(lines.length>maxL){ const rest=lines.slice(maxL-1).join(' '); lines.length=maxL-1; lines.push(fit(rest,maxW)); }
      return lines;
    };
    ctx.fillStyle=C.bg; ctx.fillRect(0,0,cw,ch);
    ctx.textBaseline='middle'; ctx.textAlign='left';
    ctx.fillStyle=C.accent; ctx.font='400 28px "Yatra One"'+FB; ctx.fillText('नातागोता ट्रयाकिङ',24,28);
    const meP=state.kin&&state.me?GR().by.get(state.me):null;
    const sub=[village(),N(nodes.length)+' सदस्य',meP?dn(meP)+' बाट हेरिएको नाता':''].filter(Boolean).join(' · ');
    ctx.fillStyle=C.muted; ctx.font='500 14px Mukta'+FB; ctx.fillText(fit(sub,cw-48),24,56);
    ctx.strokeStyle=C.line; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(24,HEAD-6); ctx.lineTo(cw-24,HEAD-6); ctx.stroke();
    ctx.save(); ctx.translate(ox,HEAD); ctx.lineJoin='round';
    $$('svg.edges path',stage).forEach(p=>{
      const sp=p.classList.contains('sp');
      const li=p.getAttribute('data-lc'); ctx.strokeStyle=sp?C.accent:(li!==null?LC[+li]:C.edge); ctx.lineWidth=sp?1.8:1.6; ctx.setLineDash(p.getAttribute('stroke-dasharray')?[5,4]:[]);
      ctx.stroke(new Path2D(p.getAttribute('d')));
    });
    ctx.setLineDash([]);
    nodes.forEach(n=>{
      const x=parseFloat(n.style.left),y=parseFloat(n.style.top),w=148,h=74;
      const ph=n.classList.contains('ph'),dead=n.classList.contains('dead'),isMe=n.classList.contains('me');
      const g=n.classList.contains('g-F')?'F':n.classList.contains('g-O')?'O':'M';
      rr(x,y,w,h,10); ctx.fillStyle=isMe?C.me:C.bg; ctx.fill();
      ctx.lineWidth=1.5; ctx.strokeStyle=C.line; ctx.setLineDash(ph?[5,4]:[]); ctx.stroke(); ctx.setLineDash([]);
      const sx=x+15,sy=y+17;
      ctx.fillStyle=ph?C.edge:C.ink; ctx.beginPath();
      if(g==='F') ctx.arc(sx,sy,6,0,Math.PI*2);
      else if(g==='O'){ ctx.moveTo(sx,sy-7.2); ctx.lineTo(sx+7.2,sy); ctx.lineTo(sx,sy+7.2); ctx.lineTo(sx-7.2,sy); ctx.closePath(); }
      else ctx.rect(sx-6,sy-6,12,12);
      ctx.fill();
      if(dead){ ctx.strokeStyle=C.accent; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(sx-8,sy+8); ctx.lineTo(sx+8,sy-8); ctx.stroke(); }
      const nm=($('.nm',n)||{}).textContent||'',mt=($('.mt',n)||{}).textContent||'';
      ctx.font='600 14px Mukta'+FB;
      const lines=wrap(nm,110,2),total=lines.length*17.5+(mt?15:0),top=y+(h-total)/2;
      ctx.fillStyle=ph?C.muted:C.ink;
      lines.forEach((l,i)=>ctx.fillText(l,x+30,top+17.5*i+8.75));
      if(mt){ ctx.font='400 11.5px Mukta'+FB; ctx.fillStyle=C.muted; ctx.fillText(fit(mt,110),x+30,top+lines.length*17.5+7.5); }
      const k=$('.kin',n);
      if(k){
        ctx.font='600 11.5px Mukta'+FB;
        const t=fit(k.textContent,w-32),pw=ctx.measureText(t).width+16;
        rr(x+8,y-11,pw,18,9);
        ctx.fillStyle=k.classList.contains('self')?C.accent:k.classList.contains('mar')?C.gold:C.indigo; ctx.fill();
        ctx.fillStyle='#ffffff'; ctx.fillText(t,x+16,y-2);
      }
    });
    ctx.restore();
    let lx=24; const ly=HEAD+H+FOOT/2-4;
    ctx.font='500 12px Mukta'+FB;
    const item=(draw,label)=>{ draw(lx,ly); lx+=26; ctx.fillStyle=C.muted; ctx.fillText(label,lx,ly); lx+=ctx.measureText(label).width+20; };
    const shape=(kind,dead)=>(x,y)=>{
      ctx.fillStyle=C.ink; ctx.beginPath();
      if(kind==='F') ctx.arc(x+6,y,6,0,Math.PI*2);
      else if(kind==='O'){ ctx.moveTo(x+6,y-7); ctx.lineTo(x+13,y); ctx.lineTo(x+6,y+7); ctx.lineTo(x-1,y); ctx.closePath(); }
      else ctx.rect(x,y-6,12,12);
      ctx.fill();
      if(dead){ ctx.strokeStyle=C.accent; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(x-2,y+8); ctx.lineTo(x+14,y-8); ctx.stroke(); }
    };

/* ---------- चार्ट जुम: दुई औँलाले पिन्च, Ctrl+स्क्रोल, बटन ---------- */
function applyZoom(z,fx,fy,anchor){
  const cv=$('#canvas'),stage=$('#stage'),zm=$('#zoomer'); if(!cv||!stage||!zm) return;
  z=Math.min(2.5,Math.max(.3,z));
  const rect=cv.getBoundingClientRect(),old=state.zoom;
  const px=anchor?anchor[0]:(cv.scrollLeft+fx-rect.left)/old,py=anchor?anchor[1]:(cv.scrollTop+fy-rect.top)/old;
  const W=parseFloat(stage.style.width),H=parseFloat(stage.style.height);
  state.zoom=z; stage.style.transform='scale('+z+')'; zm.style.width=(W*z)+'px'; zm.style.height=(H*z)+'px';
  cv.scrollLeft=px*z-(fx-rect.left); cv.scrollTop=py*z-(fy-rect.top);
  const zl=$('#zl'); if(zl) zl.textContent=N(Math.round(z*100))+'%';
}
(function(){
  let pinch=null,wt=null;
  const dist=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY)||1;
  const mid=t=>[(t[0].clientX+t[1].clientX)/2,(t[0].clientY+t[1].clientY)/2];
  const inCanvas=e=>e.target&&e.target.closest&&e.target.closest('#canvas');
  document.addEventListener('touchstart',e=>{
    if(e.touches.length===2&&inCanvas(e)){
      const cv=$('#canvas'),r=cv.getBoundingClientRect(),m=mid(e.touches),z=state.zoom;
      pinch={d:dist(e.touches),z,ax:(cv.scrollLeft+m[0]-r.left)/z,ay:(cv.scrollTop+m[1]-r.top)/z};
    }
  },{passive:true});
  document.addEventListener('touchmove',e=>{
    if(pinch&&e.touches.length===2){ e.preventDefault(); const m=mid(e.touches); applyZoom(pinch.z*dist(e.touches)/pinch.d,m[0],m[1],[pinch.ax,pinch.ay]); }
  },{passive:false});
  const end=e=>{ if(pinch&&e.touches.length<2){ pinch=null; state.zoom=Math.round(state.zoom*100)/100; saveUI(); } };
  document.addEventListener('touchend',end); document.addEventListener('touchcancel',end);
  document.addEventListener('wheel',e=>{
    if((e.ctrlKey||e.metaKey)&&inCanvas(e)){ e.preventDefault(); applyZoom(state.zoom*Math.exp(-e.deltaY*0.0025),e.clientX,e.clientY); clearTimeout(wt); wt=setTimeout(()=>{ state.zoom=Math.round(state.zoom*100)/100; saveUI(); },300); }
  },{passive:false});
})();

function addAt(anchor,path,name){
  const work=new Map();
  const base=()=>{ const m=new Map(persons().map(p=>[p.id,p])); work.forEach((d,id)=>m.set(id,d)); return [...m.values()]; };
  const gr=()=>buildGraph(base());
  const mod=id=>{ if(!work.has(id)) work.set(id,JSON.parse(JSON.stringify(gr().by.get(id)))); return work.get(id); };
  const mk=(g,nm,ph)=>{ const d={id:uid(),name:nm,g,by:null,dead:false,dy:null,house:'',note:'',ph:!!ph,parents:[],spouses:[],hints:{}}; work.set(d.id,d); return d; };
  const link=(a,b)=>{ const A=mod(a),B=mod(b); if(!A.spouses.includes(b)) A.spouses.push(b); if(!B.spouses.includes(a)) B.spouses.push(a); };
  const make=(cur,tok,nm,ph)=>{
    const g=GEN_OF[tok],c=mod(cur);
    if(tok==='पि'||tok==='मा'){
      const d=mk(g,nm,ph); c.parents.push({id:d.id,k:'जन्म'});
      const GG=gr();
      const other=c.parents.filter(r=>r.id!==d.id).map(r=>GG.by.get(r.id)).find(p=>p&&p.g!==g&&p.g!=='O');
      if(other&&!GG.sp.get(other.id).size) link(d.id,other.id);
      return d;
    }
    if(tok==='छो'||tok==='छी'){
      const d=mk(g,nm,ph); d.parents.push({id:cur,k:'जन्म'});
      const sp=[...gr().sp.get(cur)]; if(sp.length===1) d.parents.push({id:sp[0],k:'जन्म'});
      return d;
    }
    if(tok==='पति'||tok==='पत्नी'){ const d=mk(g,nm,ph); link(cur,d.id); return d; }
    const d=mk(g,nm,ph);
    let ps=c.parents.slice();
    if(!ps.length){ const f=mk('M','',true),m=mk('F','',true); link(f.id,m.id); ps=[{id:f.id,k:'जन्म'},{id:m.id,k:'जन्म'}]; c.parents=ps.slice(); }
    d.parents=ps.map(r=>({id:r.id,k:r.k}));
    if(tok==='दा'||tok==='दि') d.hints[cur]=1;
    if(tok==='भा'||tok==='ब') d.hints[cur]=-1;
    return d;
  };
  let cur=anchor;
  for(let i=0;i<path.length-1;i++){
    const f=stepFind(gr(),cur,path[i]);
    cur=f.length?f[0]:make(cur,path[i],'',true).id;
  }
  const last=path[path.length-1],f=stepFind(gr(),cur,last),GG=gr();
  const phs=f.map(id=>GG.by.get(id)).find(p=>p.ph);
  if(phs){ const d=mod(phs.id); d.name=name; d.ph=false; }
  else make(cur,last,name,false);
  commit([...work.values()]);
}

const K256=[],H256=[];
(function(){ let pc=0; for(let c=2;pc<64;c++){ let p=true; for(let d=2;d*d<=c;d++) if(c%d===0){p=false;break;} if(p){ if(pc<8) H256[pc]=(Math.pow(c,.5)%1*4294967296)|0; K256[pc++]=(Math.pow(c,1/3)%1*4294967296)|0; } } })();
function sha256(msg){
  const bytes=new TextEncoder().encode(msg),l=bytes.length,n=((l+9+63)>>6)<<6,buf=new Uint8Array(n);
  buf.set(bytes); buf[l]=0x80;
  const dv=new DataView(buf.buffer); dv.setUint32(n-4,(l*8)>>>0); dv.setUint32(n-8,Math.floor(l*8/4294967296));
  const H=H256.slice(),w=new Int32Array(64);
  for(let o=0;o<n;o+=64){
    for(let i=0;i<16;i++) w[i]=dv.getInt32(o+i*4);
    for(let i=16;i<64;i++){ const a=w[i-15],b=w[i-2]; const s0=((a>>>7)|(a<<25))^((a>>>18)|(a<<14))^(a>>>3); const s1=((b>>>17)|(b<<15))^((b>>>19)|(b<<13))^(b>>>10); w[i]=(w[i-16]+s0+w[i-7]+s1)|0; }
    let a=H[0],b=H[1],c=H[2],d=H[3],e=H[4],f=H[5],g=H[6],h=H[7];
    for(let i=0;i<64;i++){
      const S1=((e>>>6)|(e<<26))^((e>>>11)|(e<<21))^((e>>>25)|(e<<7)),ch=(e&f)^(~e&g),t1=(h+S1+ch+K256[i]+w[i])|0;
      const S0=((a>>>2)|(a<<30))^((a>>>13)|(a<<19))^((a>>>22)|(a<<10)),mj=(a&b)^(a&c)^(b&c),t2=(S0+mj)|0;
      h=g;g=f;f=e;e=(d+t1)|0;d=c;c=b;b=a;a=(t1+t2)|0;
    }
    H[0]=(H[0]+a)|0;H[1]=(H[1]+b)|0;H[2]=(H[2]+c)|0;H[3]=(H[3]+d)|0;H[4]=(H[4]+e)|0;H[5]=(H[5]+f)|0;H[6]=(H[6]+g)|0;H[7]=(H[7]+h)|0;
  }
  return H.map(x=>(x>>>0).toString(16).padStart(8,'0')).join('');
}
function hashPw(salt,pw){ let h=sha256(salt+':'+pw); for(let i=0;i<3000;i++) h=sha256(h+salt); return h; }
function mkPw(pw){ const a=new Uint8Array(12); (window.crypto||{getRandomValues:x=>{for(let i=0;i<x.length;i++)x[i]=Math.random()*256;}}).getRandomValues(a); const s=Array.from(a,x=>x.toString(16).padStart(2,'0')).join(''); return {s,h:hashPw(s,pw)}; }

function buildDoc(seed){

async function doPublish(btn){
  if(!caps.art){ toast('प्रकाशित गर्ने अनुमति उपलब्ध छैन।'); return; }
  if(SK_HEAD.indexOf('<!doctype')!==0){ toast('प्रकाशन अहिले तयार छैन।'); return; }
  const seed=fullData();
  seed.persons=seed.persons.filter(p=>!p._del);
  lsSet(LSP,String(seed.meta.rev));
  if(btn) btn.disabled=true;
  toast('प्रकाशित गर्दै…');
  try{ await caps.art.publish(buildDoc(seed)); }
  catch(e){
    lsDel(LSP); if(btn) btn.disabled=false;
    const c=e&&e.code;
    if(c==='conflict') return;
    toast(c==='not_writer'||c==='not_granted'?'तपाईंसँग यो पृष्ठ प्रकाशित गर्ने अधिकार छैन।':'प्रकाशित हुन सकेन। केही बेरपछि फेरि प्रयास गर्नुहोस्।');
  }
}

    <div class="fld full"><span class="lbl">आमाबुबा (दुई वा बढी थप्न सकिन्छ)</span><div id="f-par">${pars.map(r=>mrow('par',r.id,r.k)).join('')}</div><div><button type="button" class="btn sm" data-act="addpar">+ आमा / बुबा थप्नुहोस्</button></div></div>
    <div class="fld full"><span class="lbl">श्रीमान् / श्रीमती (एकभन्दा बढी भए सबै थप्नुहोस्)</span><div id="f-sp">${sps.map(s=>mrow('sp',s)).join('')}</div><div><button type="button" class="btn sm" data-act="addsp">+ श्रीमान् / श्रीमती थप्नुहोस्</button></div></div>
  </div>
  <p class="ferr" id="ferr" role="alert"></p>
  <div class="foot"><button type="button" class="btn" data-act="close">रद्द</button><button type="submit" class="btn pri">सुरक्षित गर्नुहोस्</button></div></form>`);
}
function ferr(m){ const e=$('#ferr'); if(e) e.textContent=m; }
function yearOf(s){
  s=ASC(String(s||'')).trim(); if(!s) return {v:null};
  const n=parseInt(s,10); if(!/^\d{4}$/.test(s)||n<1900||n>2200) return {err:true};
  return {v:n};
}
function submitPerson(form){
  const id=form.dataset.id,childOf=form.dataset.childof,fe=form.elements;
  const name=fe.name.value.trim();
  if(!name){ ferr('नाम लेख्नुहोस्।'); return; }
  const by=yearOf(fe.by.value),dy=yearOf(fe.dy.value);
  if(by.err||dy.err){ ferr('साल वि.सं. मा चार अंकमा लेख्नुहोस्, जस्तै २०४५।'); return; }
  const g0=GR(),gen=fe.g.value||'M';
  const pr=$$('.mrow[data-kind=par]',form).map(r=>({id:$('select',r).value,k:$$('select',r)[1].value})).filter(r=>r.id);
  const par=[]; pr.forEach(r=>{ if(!par.some(x=>x.id===r.id)) par.push(r); });
  const sps=[...new Set($$('.mrow[data-kind=sp] select',form).map(s=>s.value).filter(Boolean))];
  const newId=id||uid();
  if(par.some(r=>r.id===newId)||sps.includes(newId)){ ferr('व्यक्ति आफ्नै आमाबुबा वा श्रीमान्-श्रीमती हुन सक्दैन।'); return; }
  if(id&&par.some(r=>isDescendant(g0,r.id,id))){ ferr('आफ्नै सन्तानलाई आमाबुबा बनाउन मिल्दैन।'); return; }
  const old=id?g0.by.get(id):null;
  const doc=Object.assign(old?JSON.parse(JSON.stringify(old)):{id:newId,hints:{}},{name,g:gen,by:by.v,dead:!!fe.dead.checked,dy:dy.v,house:fe.house.value.trim(),note:fe.note.value.trim(),ph:false,sample:false,parents:par,spouses:sps});
  const out=[doc],newSp=new Set(sps);
  persons().forEach(o=>{
    if(o.id===newId) return;
    let sp=(o.spouses||[]).slice(),chg=false;
    if(newSp.has(o.id)&&!sp.includes(newId)){ sp.push(newId); chg=true; }
    if(!newSp.has(o.id)&&sp.includes(newId)){ sp=sp.filter(x=>x!==newId); chg=true; }
    if(chg){ const c=JSON.parse(JSON.stringify(o)); c.spouses=sp; out.push(c); }
  });
  if(childOf&&g0.by.has(childOf)){
    const c=out.find(x=>x.id===childOf)||JSON.parse(JSON.stringify(g0.by.get(childOf)));
    if(!(c.parents||[]).some(r=>r.id===newId)) c.parents=(c.parents||[]).concat([{id:newId,k:'जन्म'}]);
    if(!out.includes(c)) out.push(c);
  }
  closeModal(); state.sel=newId;
  commit(out); toast('सुरक्षित भयो');
}
function newAnchorForm(){
  openModal(`<form id="aform"><h2>नयाँ व्यक्ति बनाउनुहोस्</h2><div class="grid"><div class="fld full"><label for="a-name">पूरा नाम</label><input type="text" id="a-name" name="name" autocomplete="off" required></div>
  <div class="fld"><span class="lbl">लिङ्ग</span><div class="radios">${['M','F','O'].map(x=>`<label><input type="radio" name="g" value="${x}"${x==='M'?' checked':''}> ${GLBL[x]}</label>`).join('')}</div></div>
  <div class="fld"><label for="a-by">जन्म साल (वि.सं.)</label><input type="text" id="a-by" name="by" inputmode="numeric" placeholder="जस्तै २०४५"></div></div>
  <p class="ferr" id="ferr" role="alert"></p><div class="foot"><button type="button" class="btn" data-act="close">रद्द</button><button type="submit" class="btn pri">बनाउनुहोस्</button></div></form>`);
}

/* ---------- घटना ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]'); if(!t) return;
  const a=t.dataset.act,id=t.dataset.id;
  if(a==='ovclose'){ if(e.target===t) closeModal(); return; }
  if(a==='tab') setTab(t.dataset.t);
  else if(a==='add') openForm(null);
  else if(a==='pick'){ if(e.target.closest('.chip')&&state.tab==='table'){ pick(id); } else pick(id); }
  else if(a==='closedetail'){ state.sel=null; $$('.node.sel').forEach(n=>n.classList.remove('sel')); renderDetail(); }
  else if(a==='setme'){ state.me=id; saveUI(); render(); }
  else if(a==='edit') openForm(id);
  else if(a==='relatives'){ state.anchor=id; setTab('table'); }
  else if(a==='addchild'){ const g=GR(),sp=[...g.sp.get(id)],h=g.by.get(id); openForm(null,{title:'छोराछोरी थप्नुहोस्',parents:[{id,k:'जन्म'}].concat(sp.length===1?[{id:sp[0],k:'जन्म'}]:[]),house:h.house}); }
  else if(a==='addspouse'){ const h=GR().by.get(id); openForm(null,{title:'श्रीमान् / श्रीमती थप्नुहोस्',spouses:[id],g:h.g==='M'?'F':'M'}); }
  else if(a==='addparent'){ const h=GR().by.get(id); openForm(null,{title:'आमा / बुबा थप्नुहोस्',childOf:id,house:h.house}); }
  else if(a==='del'){ state.confirmDel=id; renderDetail(); }
  else if(a==='delno'){ state.confirmDel=null; renderDetail(); }
  else if(a==='delok'){ state.confirmDel=null; deleteMany([id]); toast('मेटाइयो'); }
  else if(a==='close') closeModal();
  else if(a==='rmrow') t.closest('.mrow').remove();
  else if(a==='addpar'){ $('#f-par').insertAdjacentHTML('beforeend',mrow('par','')); }
  else if(a==='addsp'){ $('#f-sp').insertAdjacentHTML('beforeend',mrow('sp','')); }
  else if(a==='zoom'){ state.zoom=Math.min(2.5,Math.max(.3,Math.round((state.zoom+parseFloat(t.dataset.d))*100)/100)); saveUI(); const z=$('#zl'); if(z) z.textContent=N(Math.round(state.zoom*100))+'%'; drawStage(); }
  else if(a==='zoomfit'){ const cv=$('#canvas'),st=$('#stage'); if(cv&&st){ const W=parseFloat(st.style.width)||1; const z=Math.max(.3,Math.min(1.6,Math.floor((cv.clientWidth-4)/W*100)/100)); const r=cv.getBoundingClientRect(); applyZoom(z,r.left,r.top,[0,0]); cv.scrollLeft=0; cv.scrollTop=0; saveUI(); } }
  else if(a==='clearsample'){ deleteMany(persons().filter(p=>p.sample).map(p=>p.id)); toast('नमुना हटाइयो'); }
  else if(a==='newanchor') newAnchorForm();
  else if(a==='addrel'){
    const inp=$('.tname[data-r="'+t.dataset.r+'"]');
    if(inp&&inp.value.trim()){
      const i=+t.dataset.r,typed=$$('.tname').filter(x=>x!==inp&&x.value).map(x=>[x.dataset.r,x.value]);
      state.open[REL[i].sec]=true; addRel(i,inp.value);
      typed.forEach(([r,v])=>{ const x=$('.tname[data-r="'+r+'"]'); if(x) x.value=v; });
      toast('थपियो');
    }
  }
  else if(a==='copycode') copyText(exportCode(),$('#code-out'));
  else if(a==='copyall') copyText('NTG1'+JSON.stringify({docs:persons(),village:village()}),null);
  else if(a==='dlall'){ saveFile('natagota-backup.json',JSON.stringify(fullData(),null,1),'application/json'); toast('फाइल तयार भयो'); }
  else if(a==='dlsite'){ const seed=fullData(); lsSet(LSP,String(seed.meta.rev)); saveFile('index.html',buildDoc(seed),'text/html'); toast('index.html तयार भयो। यसलाई होस्टिङमा अपलोड गर्नुहोस्।'); }
  else if(a==='admin'){ if(ADMIN) setTab('share'); else openLogin(); }
  else if(a==='exitadmin'){ ADMIN=false; try{ sessionStorage.removeItem('ntg_adm'); }catch(e){} document.body.classList.add('view'); state.tab='chart'; try{ location.hash='chart'; }catch(e){} render(); }
  else if(a==='setpw'){ const p1=$('#pw-n1').value,p2=$('#pw-n2').value; if(p1.length<6) toast('पासवर्ड कम्तीमा ६ अक्षरको राख्नुहोस्।'); else if(p1!==p2) toast('दुवै पासवर्ड मिलेन।'); else { local.meta.pw=mkPw(p1); persistLocal(); $('#pw-n1').value=''; $('#pw-n2').value=''; toast('नयाँ पासवर्ड राखियो। नयाँ index.html बनाएर अपलोड गर्नुहोस्।'); } }
  else if(a==='dlimg') exportChartImage(t);
  else if(a==='dlimgall') exportChartImage(t,true);
  else if(a==='importcode'){
    const raw=($('#code-in').value||'').trim();
    try{
      if(!raw.startsWith('NTG1')) throw 0;
      const o=JSON.parse(raw.slice(4)); if(!o||!Array.isArray(o.docs)) throw 0;
      let c=0; o.docs.forEach(d=>{ if(d&&typeof d.id==='string'){ local.docs[d.id]=d; c++; } });
      if(typeof o.village==='string'&&o.village) local.meta.village=o.village;
      pcache=null;gcache=null; persistLocal(); fixSel(); render(); toast(N(c)+' विवरण मिलाइयो');
    }catch(er){ toast('कोड मिलेन। पूरै कोड NTG1 सहित टाँस्नुहोस्।'); }
  }
  else if(a==='publish') doPublish(t);
  else if(a==='clearlocal1'){ state.confirmDel='local'; renderShare(); }
  else if(a==='clearlocal0'){ state.confirmDel=null; renderShare(); }
  else if(a==='clearlocal2'){ state.confirmDel=null; local={docs:{},meta:{}}; pcache=null;gcache=null; persistLocal(); fixSel(); render(); toast('परिवर्तन हटाइयो'); }
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&$('#modal')&&$('#modal').innerHTML) { closeModal(); return; }
  if(e.key==='Enter'){
    const t=e.target;
    if(t.classList&&t.classList.contains('tname')){ e.preventDefault(); const b=t.parentElement.querySelector('[data-act=addrel]'); if(b) b.click(); }
    else if(t.matches&&t.matches('tr.clk')){ pick(t.dataset.id); }
  }
});
document.addEventListener('submit',e=>{
  e.preventDefault();
  const f=e.target;
  if(f.id==='lform') doLogin(f);
  else if(f.id==='pform') submitPerson(f);
  else if(f.id==='aform'){
    const name=f.elements.name.value.trim(),by=yearOf(f.elements.by.value);
    if(!name){ ferr('नाम लेख्नुहोस्।'); return; }
    if(by.err){ ferr('साल वि.सं. मा चार अंकमा लेख्नुहोस्।'); return; }
    const d={id:uid(),name,g:f.elements.g.value||'M',by:by.v,dead:false,dy:null,house:'',note:'',ph:false,parents:[],spouses:[],hints:{}};
    closeModal(); state.anchor=d.id; commit([d]);
  }
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='me-sel'){ state.me=t.value||null; saveUI(); render(); }
  else if(t.id==='scope-sel'){ state.scope=t.value; saveUI(); drawStage(); }
  else if(t.id==='kin-chk'){ state.kin=t.checked; saveUI(); drawStage(); }
  else if(t.id==='anch-sel'){ state.anchor=t.value||null; renderTable(); }
  else if(t.id==='h-sel'){ state.house=t.value; renderList(); }
  else if(t.id==='vil-in'){ local.meta.village=t.value.trim(); persistLocal(); render(); }
});
document.addEventListener('input',e=>{
  if(e.target.id==='q-in'){ const v=e.target.value,pos=e.target.selectionStart; state.q=v; renderList(); const n=$('#q-in'); if(n){ n.focus(); try{n.setSelectionRange(pos,pos);}catch(x){} } }
});
document.addEventListener('toggle',e=>{ const d=e.target; if(d&&d.classList&&d.classList.contains('sec')) state.open[d.dataset.s]=d.open; },true);
window.addEventListener('hashchange',()=>{ const h=(location.hash||'').slice(1); if(TABS.some(t=>t[0]===h)&&h!==state.tab){ state.tab=h; render(); } });

/* ---------- सुरु ---------- */
try{ if(sessionStorage.getItem('ntg_adm')==='1'&&pwRec()) ADMIN=true; }catch(e){}
document.body.classList.toggle('view',!ADMIN);
shell();
(function(){ const h=(location.hash||'').slice(1); if(TABS.some(t=>t[0]===h)) state.tab=h; })();
fixSel(); render();
(async function(){
  try{
    if(!window.claude||!window.claude.use) return;
    const [a,u,d]=await Promise.all([window.claude.use('artifact'),window.claude.use('user'),window.claude.use('downloads')]);
    caps.art=a; caps.dl=d;
    if(a&&u){ try{ caps.canPub=!!(await u.canEdit()); }catch(e){} }
    render();
  }catch(e){}
})();
})();
</script>
